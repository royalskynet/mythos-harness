model:
  default: beam-free
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
fallback_providers:
  - provider: opencode-go
    model: deepseek-v4.1-flash
  - provider: opencode-go
    model: glm-5.3-flash
  - provider: opencode-go
    model: beam-free
  - provider: opencode-go
    model: iceman-contributor-free
  # 11-25：429 會把 Go 憑證標 exhausted、同 provider 棒全被 _candidate_pool_exhausted 跳過；
  # 配額死時只有非 Go 腿活得下來。
  - provider: omniroute
    model: nim-pool
    base_url: http://127.0.0.1:20130/v1
    key_env: OMNIROUTE_API_KEY
model_catalog:
  excluded_providers:
    - openrouter
    - copilot
    - ollama-cloud
    - anthropic
plugins:
  enabled:
    - mythos-tools
    - router-guard
  entries:
    mythos-tools:
      allow_gateway_injection: true
    router-guard:  # /hard <任務> 要把任務送進對話
      allow_gateway_injection: true
_config_version: 53
# 11-11：state.db 是 Hermes 的對話紀錄庫，預設不清（auto_prune 關），子代理每跑一次就多一批工具輸出，只增不減。
# 不拿它當記憶：結束超過 7 天的 session 自動刪、刪完壓縮。長期記憶走 memories/（MEMORY.md、USER.md）＋ claude-mem。
sessions:
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
  vacuum_after_prune: true
  min_vacuum_interval_days: 7
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: claude-mem
gateway:
  # 11-08：multiplexer 下 profile plugin 的 transform_llm_output 從沒觸發（outlet 漏擋 reasoning-only 回覆），
  # 改跑自己的 gateway 行程。官方標明是過渡 shim，移除前 release notes 會預告。
  standalone: true
  platforms:
    telegram:
      enabled: true
      extra:
        allow_from:
          - '${MYTHOS_TG_CHAT_ID}'
approvals:
  destructive_slash_confirm: false
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '${MYTHOS_TG_CHAT_ID}'
      name: Home
      user_id: '${MYTHOS_TG_CHAT_ID}'
display:
  # 11-11：連發訊息預設 interrupt 會打斷前一則回合（那則就沒回覆）；改排隊，前一則答完再接下一則。
  busy_input_mode: queue
  busy_ack_enabled: false
  # 11-08：transform_llm_output 每回合只對最終回覆觸發一次（agent/turn_finalizer.py:470），
  # 工具呼叫旁的中間訊息直接送 TG、不經 adhd-outlet。關掉，只留最終回覆一條出口（取代升 Hermes 換 hold_stream）。
  platforms:
    telegram:
      interim_assistant_messages: false
# Router 帶入子代理所需工具；router-guard 限制 Router 只聊天與派工，不給 MCP；
# 不開 tool_search，免得它在找工具的迴圈裡占住對話。
platform_toolsets:
  telegram: [mythos, delegation, memory, terminal, file, no_mcp]
  cli: [mythos, delegation, memory, terminal, file, no_mcp]
delegation:
  compression_threshold_tokens: 32000  # 11-12 省 token：子代理自己的壓縮門檻
  max_summary_chars: 3000  # 11-12 省 token：子代理回報給主對話的上限，全文另存磁碟
  provider: opencode-go
  # 11-25b：主棒改免費層（跟 Router 同路）。deepseek 配額死時子代理不再先白撞 429、
  # 也不會落到 nim-pool 等幾分鐘；配額恢復後 deepseek 在鏈裡仍當品質腿。
  model: hy4-flash-free
  max_iterations: 40
  # 11-11：interim_assistant_messages 關掉後，gateway_mode 預設 auto 會把派工改成同回合等待
  # （tools/delegate_tool_config.py gateway_delegation_inline），Router 整回合卡住、新訊息排隊。明寫 background。
  gateway_mode: background
  # 11-25：pinned 子代理（delegation.provider/model 明寫）不繼承頂層 fallback_providers
  # （scoped_fallback_chain pinned → 不用 parent 鏈），鏈要寫在 delegation 自己底下。
  # 沒寫時 429 一跳就死（11-25 00:23 兩個子代理各 1.2s 陣亡）。階梯照 worker：of 免費層 → oo 自有 key。
  fallback_providers:
    - provider: opencode-go
      model: beam-free
    - provider: opencode-go
      model: iceman-contributor-free
    - provider: opencode-go
      model: deepseek-v4.1-flash
    - provider: omniroute
      model: nim-pool      # 殿後：跨 provider 活路，但 NIM 池冷啟動可能幾分鐘，只當最後手段
      base_url: http://127.0.0.1:20130/v1
      key_env: OMNIROUTE_API_KEY
tools:
  tool_search:
    enabled: false
# 11-08 驗屍 #4：供應商暫掛時不在同一回合裡重試／自癒占住對話；fallback 鏈照走。
# coding_context 預設 auto：cwd 像程式 repo 就注入「coding agent」說明（叫模型用 read_file／search_files），
# Router 的動手工具只供子代理使用，Router 永遠不是 coding agent。
agent:
  coding_context: "off"
  api_max_retries: 1
  auto_recovery_cycles: 0
terminal:
  cwd: /Users/me/.hermes/profiles/mythos
compression:
  proactive_prune_tokens: 16000  # 11-12 省 token：超過就先剪掉舊的大型工具輸出（不叫模型）
  # 11-12：24000 太低——壓完還剩約 24000～25000（系統提示＋工具＋保留的尾段），9 分鐘連壓 5 次；要明顯高於這個底。
  threshold_tokens: 48000  # 省 token：對話超過這個量就壓縮，不等到視窗的 75%
# 11-25：fallback 鏈的 provider: omniroute 要在 custom_providers 註冊才 bind 得到
# （route_binding.py resolve_provider_client 找不到名 → "provider not configured"）。
custom_providers:
  - name: omniroute
    api_key: ${OMNIROUTE_API_KEY}
    api_mode: chat_completions
    base_url: http://127.0.0.1:20130/v1
    models:
      - nim-pool
      - nim-first
