name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: command -v timeout || command -v gtimeout || brew install coreutils
      - run: bash tests/test_router_template.sh
      - run: bash tests/test_p1_harness.sh
      - run: node --test tests/test_dispatch_gate.mjs
      - run: bash tests/test-review-judge.sh
      - run: bash tests/test-watchdog.sh
      - run: bash tests/test-dispatch-route.sh
      - run: bash tests/test_idle_reset.sh
      - run: bash tests/test_dispatch_deep.sh
      - run: bash tests/test_dispatch_watch.sh
      - run: bash tests/test_launchd_install.sh
      - run: bash tests/test-dispatch-gate-handson.sh
      - run: bash tests/test-test-guard.sh
      - run: bash tests/test-no-orphan-sleep.sh
      - run: bash tests/test-knob-timing.sh
      - run: bash tests/test-latency-report.sh
      - run: bash tests/test-repo-queue.sh
      - run: bash tests/test-dispatch-bg.sh
      - run: bash tests/test-dispatch-bg-watch.sh
      - run: bash tests/test-dispatch-gate-bg.sh
      - run: bash tests/test-tg-send.sh
      - run: bash tests/test-tg-plugin-patch.sh
      - run: bash tests/test-tg-reply-thread.sh
